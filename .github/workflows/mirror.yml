name: mirror

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: mirror
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION: '22.22.2'

jobs:
  mirror:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm ci --prefix postman

      - name: Fetch the live spec
        run: npm run generate

      - name: Lint the spec
        run: npm run lint

      - name: Build and validate the Postman collection
        run: npm --prefix postman run build

      - name: Commit the mirror if it changed
        id: commit
        run: |
          if git diff --quiet -- openapi.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "openapi.json already matches the live API."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add openapi.json
          git commit -m "Update openapi.json from the live API"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload the Postman collection
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          POSTMAN_COLLECTION_UID: ${{ secrets.POSTMAN_COLLECTION_UID }}
        run: npm --prefix postman run upload
